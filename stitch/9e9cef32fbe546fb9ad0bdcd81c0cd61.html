<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Operator Editor - ShiftLedger Lite</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#45464d",
                        "secondary-container": "#316bf3",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#dbe1ff",
                        "on-primary-fixed-variant": "#3f465c",
                        "primary-container": "#131b2e",
                        "on-primary-fixed": "#131b2e",
                        "tertiary-fixed-dim": "#dec29a",
                        "inverse-surface": "#303032",
                        "surface-bright": "#fcf8fa",
                        "on-error": "#ffffff",
                        "surface-container": "#f0edef",
                        "primary": "#000000",
                        "on-tertiary-fixed": "#271901",
                        "on-secondary-fixed-variant": "#003ea8",
                        "primary-fixed-dim": "#bec6e0",
                        "inverse-primary": "#bec6e0",
                        "surface-tint": "#565e74",
                        "on-surface": "#1b1b1d",
                        "background": "#fcf8fa",
                        "secondary-fixed-dim": "#b4c5ff",
                        "surface-container-highest": "#e4e2e4",
                        "inverse-on-surface": "#f3f0f2",
                        "surface-container-low": "#f6f3f5",
                        "on-background": "#1b1b1d",
                        "primary-fixed": "#dae2fd",
                        "on-secondary-container": "#fefcff",
                        "on-primary-container": "#7c839b",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#98805d",
                        "outline-variant": "#c6c6cd",
                        "surface-variant": "#e4e2e4",
                        "outline": "#76777d",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#00174b",
                        "surface": "#fcf8fa",
                        "tertiary": "#000000",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#0051d5",
                        "surface-dim": "#dcd9db",
                        "tertiary-container": "#271901",
                        "tertiary-fixed": "#fcdeb5",
                        "surface-container-high": "#eae7e9",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#574425"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "row-height-standard": "44px",
                        "stack-md": "0.75rem",
                        "unit": "4px",
                        "container-padding": "1.5rem",
                        "row-height-compact": "32px",
                        "stack-sm": "0.25rem",
                        "gutter": "1rem"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "display": ["Inter"],
                        "body-base": ["Inter"],
                        "display-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "data-mono": ["JetBrains Mono"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                        "display": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "body-base": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "display-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-md": ["18px", {"lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "data-mono": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                        "label-caps": ["11px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; } /* Base layer Slate 50 equivalent based on Style Guidance */
    </style>
</head>
<body class="bg-background text-on-background min-h-screen">
<!-- Top Navigation Shell SUPPRESSED based on rules for Task-Focused/Linear/Transactional screen with Cancel/Back action -->
<!-- Main Content Canvas -->
<main class="max-w-4xl mx-auto py-container-padding px-container-padding flex flex-col gap-stack-md h-screen">
<!-- Header / Context Area -->
<header class="flex items-center justify-between pb-unit border-b border-outline-variant">
<div class="flex items-center gap-stack-sm">
<button aria-label="Go Back" class="text-on-surface-variant hover:text-on-surface transition-colors p-1 rounded hover:bg-surface-container-high">
<span class="material-symbols-outlined text-xl">arrow_back</span>
</button>
<div>
<h1 class="font-display text-display text-primary">Edit Operator Profile</h1>
<p class="font-data-mono text-data-mono text-on-surface-variant mt-1">ID: OP-7492-X</p>
</div>
</div>
<!-- Unsaved Changes Indicator (Hidden by default, shown for spec) -->
<div class="flex items-center gap-2 bg-surface-container-low px-3 py-1.5 rounded border border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant text-sm">edit_note</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Unsaved changes</span>
</div>
</header>
<!-- Editor Form Canvas -->
<div class="bg-surface border border-outline-variant rounded flex-1 overflow-hidden flex flex-col shadow-sm">
<!-- Editor Content Area (Scrollable) -->
<div class="p-container-padding flex-1 overflow-y-auto">
<form class="max-w-2xl mx-auto flex flex-col gap-stack-md">
<!-- Form Group: Operator Details -->
<fieldset class="border border-outline-variant rounded p-gutter bg-surface-container-lowest">
<legend class="font-label-caps text-label-caps text-on-surface-variant px-2 bg-surface-container-lowest border border-outline-variant rounded-sm ml-2">Core Identity</legend>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter mt-2">
<!-- Name Field -->
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface flex items-center gap-1" for="operator-name">
                                    Full Name <span aria-hidden="true" class="text-error">*</span>
</label>
<input class="h-row-height-compact border border-outline-variant rounded bg-surface px-2 font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors" id="operator-name" name="operator-name" required="" type="text" value="Jane Doe"/>
</div>
<!-- Role Field -->
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface flex items-center gap-1" for="operator-role">
                                    Primary Role <span aria-hidden="true" class="text-error">*</span>
</label>
<div class="relative">
<select class="h-row-height-compact w-full border border-outline-variant rounded bg-surface pl-2 pr-8 font-body-base text-body-base appearance-none focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors" id="operator-role" name="operator-role" required="">
<option value="lead">Shift Lead</option>
<option selected="" value="tech">Systems Technician</option>
<option value="analyst">Data Analyst</option>
<option value="support">L2 Support</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-sm">arrow_drop_down</span>
</div>
</div>
</div>
</fieldset>
<!-- Form Group: Operational Assignment -->
<fieldset class="border border-outline-variant rounded p-gutter bg-surface-container-lowest mt-4">
<legend class="font-label-caps text-label-caps text-on-surface-variant px-2 bg-surface-container-lowest border border-outline-variant rounded-sm ml-2">Assignment Data</legend>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter mt-2">
<!-- Shift Field -->
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface flex items-center gap-1" for="operator-shift">
                                    Current Shift Cycle <span aria-hidden="true" class="text-error">*</span>
</label>
<div class="relative">
<select class="h-row-height-compact w-full border border-outline-variant rounded bg-surface pl-2 pr-8 font-body-base text-body-base appearance-none focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors" id="operator-shift" name="operator-shift" required="">
<option value="alpha">Alpha (06:00 - 14:00)</option>
<option selected="" value="beta">Beta (14:00 - 22:00)</option>
<option value="gamma">Gamma (22:00 - 06:00)</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-sm">arrow_drop_down</span>
</div>
</div>
<!-- Status Toggle -->
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface">Duty Status</label>
<div class="flex items-center h-row-height-compact">
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-secondary rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-outline-variant after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-secondary"></div>
<span class="ml-3 font-body-sm text-body-sm text-on-surface">Active Duty</span>
</label>
</div>
</div>
</div>
</fieldset>
<!-- Form Group: Handoff Context -->
<fieldset class="border border-outline-variant rounded p-gutter bg-surface-container-lowest mt-4 flex flex-col gap-2">
<legend class="font-label-caps text-label-caps text-on-surface-variant px-2 bg-surface-container-lowest border border-outline-variant rounded-sm ml-2">Handoff Instructions</legend>
<div class="flex flex-col gap-1 mt-2">
<label class="font-label-caps text-label-caps text-on-surface" for="handoff-notes">Standing Notes</label>
<textarea class="border border-outline-variant rounded bg-surface p-2 font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors resize-y" id="handoff-notes" name="handoff-notes" rows="4">Requires daily sync with Alpha lead prior to rotation start. Pending clearance for Level 3 server access.</textarea>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-1 text-right">0 / 500 characters</span>
</div>
</fieldset>
</form>
</div>
<!-- Fixed Bottom Action Bar -->
<div class="h-16 bg-surface-container border-t border-outline-variant px-container-padding flex items-center justify-end gap-stack-md shrink-0">
<button class="px-4 h-row-height-compact border border-outline font-label-caps text-label-caps text-on-surface rounded hover:bg-surface-variant transition-colors flex items-center justify-center" type="button">
                    Cancel
                </button>
<button class="px-6 h-row-height-compact bg-secondary font-label-caps text-label-caps text-on-secondary rounded hover:bg-secondary/90 transition-colors flex items-center justify-center gap-2 shadow-sm" type="submit">
<span class="material-symbols-outlined text-sm">save</span>
                    Save Record
                </button>
</div>
</div>
</main>
</body></html>
